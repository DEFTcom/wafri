services:
  db:
    image: postgres:16-alpine
    container_name: care_compare_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care_local_dev
      POSTGRES_DB: care_compare
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
